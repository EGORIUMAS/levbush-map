<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кто где</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --water:#CFDCE4; --land:#ECEDE6; --local:#F8F8F4; --moscow:#EEF0F8;
  --border:#A8B1A5; --line:#CDD2C8; --river:#8EB0C6; --road:#C98B4E;
  --ink:#1C2330; --muted:#697380; --accent:#2F3BE0; --accent-ink:#FFFFFF;
  --chip:#1C2330; --chip-ink:#FFFFFF; --panel:#FFFFFF; --panel-edge:#D9DDD4;
  --field:#F3F4EF; --danger:#B3261E; --halo:rgba(248,248,244,.92);
  --shadow:0 10px 30px rgba(28,35,48,.16);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --water:#10161B; --land:#1E252A; --local:#262E34; --moscow:#2A3040;
    --border:#46515A; --line:#343E46; --river:#2F5367; --road:#9A6A3D;
    --ink:#E6EBEF; --muted:#94A0AA; --accent:#8C95FF; --accent-ink:#0D1030;
    --chip:#E6EBEF; --chip-ink:#10161B; --panel:#1A2025; --panel-edge:#2E373E;
    --field:#232A30; --danger:#FF8A80; --halo:rgba(30,37,42,.9);
    --shadow:0 10px 30px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --water:#10161B; --land:#1E252A; --local:#262E34; --moscow:#2A3040;
  --border:#46515A; --line:#343E46; --river:#2F5367; --road:#9A6A3D;
  --ink:#E6EBEF; --muted:#94A0AA; --accent:#8C95FF; --accent-ink:#0D1030;
  --chip:#E6EBEF; --chip-ink:#10161B; --panel:#1A2025; --panel-edge:#2E373E;
  --field:#232A30; --danger:#FF8A80; --halo:rgba(30,37,42,.9);
  --shadow:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--water);color:var(--ink);
  font:15px/1.45 "Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;
  -webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{position:relative;height:100%;width:100%;overflow:hidden}
#map{position:absolute;inset:0;touch-action:none}
#map.placing{cursor:crosshair}
canvas{display:block;width:100%;height:100%}
#pins{position:absolute;inset:0;pointer-events:none}

.pin{position:absolute;left:0;top:0;pointer-events:auto;border:0;background:none;padding:0;
  width:22px;height:22px;margin:-11px 0 0 -11px;display:grid;place-items:center}
.pin .dot{width:11px;height:11px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 2.5px var(--local),0 1px 4px rgba(0,0,0,.25)}
.pin .tag{position:absolute;bottom:19px;left:50%;transform:translateX(-50%);
  white-space:nowrap;background:var(--chip);color:var(--chip-ink);
  font-size:12.5px;font-weight:500;line-height:1;padding:5px 8px 6px;border-radius:7px;
  box-shadow:0 2px 6px rgba(0,0,0,.18);max-width:170px;overflow:hidden;text-overflow:ellipsis}
.pin .tag::after{content:"";position:absolute;left:50%;bottom:-4px;margin-left:-4px;
  border:4px solid transparent;border-bottom:0;border-top-color:var(--chip)}
.pin.mine .tag{background:var(--accent);color:var(--accent-ink)}
.pin.mine .tag::after{border-top-color:var(--accent)}
.pin.sel .dot{transform:scale(1.35)}
.pin.sel{z-index:3}.pin.mine{z-index:2}
.pin.notag .tag{display:none}

/* top bar */
.top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;right:12px;
  display:flex;align-items:center;gap:10px;pointer-events:none}
.brand{pointer-events:auto;display:flex;align-items:baseline;gap:10px;background:var(--panel);
  border:1px solid var(--panel-edge);border-radius:12px;padding:8px 14px 9px;box-shadow:var(--shadow)}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand .count{color:var(--muted);font-size:13.5px}
.hint{pointer-events:auto;margin-left:auto;background:var(--accent);color:var(--accent-ink);
  border-radius:12px;padding:9px 12px 9px 14px;display:none;align-items:center;gap:12px;
  box-shadow:var(--shadow);font-weight:500;font-size:14px;max-width:420px}
.hint button{border:0;background:rgba(255,255,255,.18);color:inherit;border-radius:8px;padding:5px 10px;font-weight:600}
.placing-on .hint{display:flex}

/* zoom rail */
.rail{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
.rail button{width:44px;height:44px;border-radius:12px;border:1px solid var(--panel-edge);background:var(--panel);
  box-shadow:var(--shadow);display:grid;place-items:center;font-size:20px;font-weight:500;padding:0}
.rail button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.rail .gap{height:8px}

/* bottom bar */
.bottom{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  display:flex;justify-content:center;pointer-events:none}
.primary{pointer-events:auto;border:0;background:var(--ink);color:var(--land);font-weight:600;
  font-size:16px;padding:14px 22px;border-radius:14px;box-shadow:var(--shadow);min-width:240px}
.primary:disabled{opacity:.55;cursor:default}
.placing-on .primary,.sheet-open .primary{display:none}
.attr{position:absolute;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 2px);
  font-size:10.5px;color:var(--muted);pointer-events:none;opacity:.9}
.sheet-open .attr{display:none}

/* sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:460px;
  background:var(--panel);border:1px solid var(--panel-edge);border-bottom:0;
  border-radius:18px 18px 0 0;box-shadow:var(--shadow);
  padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 18px);
  transform:translateY(105%);transition:transform .22s ease;max-height:78%;overflow-y:auto}
.sheet.open{transform:none}
@media (min-width:760px){
  .sheet{left:16px;right:auto;width:400px;bottom:16px;border-radius:18px;border-bottom:1px solid var(--panel-edge);
    padding-bottom:18px;transform:translateY(calc(100% + 30px))}
}
.sheet-head{display:flex;align-items:flex-start;gap:12px}
.sheet h2{margin:0;font-size:24px;line-height:1.15;font-weight:700;letter-spacing:-.015em;word-break:break-word}
.x{margin-left:auto;flex:none;width:36px;height:36px;border-radius:10px;border:0;background:var(--field);
  display:grid;place-items:center;padding:0}
.x svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none}
.tg{display:inline-block;margin-top:4px;color:var(--accent);font-weight:600;text-decoration:none}
.tg:hover{text-decoration:underline}
.ava{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;background:var(--field)}
.who{display:flex;gap:12px;align-items:center;min-width:0}
.tgbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:12px;
  background:#2AABEE;color:#fff;font-weight:600;font-size:16px;padding:13px 16px}
.tgbtn svg{width:22px;height:22px;fill:currentColor}
.tgbtn:disabled{opacity:.6;cursor:default}
.lead{margin:10px 0 0;color:var(--muted);font-size:14.5px}
.verified{display:flex;align-items:center;gap:8px;background:var(--field);border:1px solid var(--panel-edge);
  border-radius:11px;padding:10px 12px;font-size:15px}
.verified small{color:var(--muted);font-size:12.5px;margin-left:auto}
.bio{margin:12px 0 0;white-space:pre-wrap;word-break:break-word}
dl{margin:16px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
dt{color:var(--muted)} dd{margin:0}
.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.btn{border:1px solid var(--panel-edge);background:var(--field);border-radius:11px;padding:10px 16px;font-weight:600}
.btn.main{background:var(--ink);color:var(--land);border-color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}

form{display:grid;gap:14px;margin-top:6px}
.where{font-size:14px;color:var(--muted);margin-top:2px}
.where b{color:var(--ink);font-weight:600}
label.f{display:grid;gap:6px;font-size:13.5px;color:var(--muted)}
.inp{display:flex;align-items:center;background:var(--field);border:1px solid var(--panel-edge);border-radius:11px;padding:0 12px}
.inp:focus-within{border-color:var(--accent)}
.inp span{color:var(--muted);margin-right:2px}
.inp input,.inp textarea{flex:1;border:0;background:none;outline:none;padding:11px 0;font-size:16px;color:var(--ink);min-width:0;resize:none}
.radii{display:flex;gap:6px;flex-wrap:wrap}
.radii button{border:1px solid var(--panel-edge);background:var(--field);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500}
.radii button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.note{font-size:12.5px;color:var(--muted);margin:0}
.err{color:var(--danger);font-size:14px;margin:0;min-height:0}
.err:empty{display:none}

.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 72px);transform:translate(-50%,-8px);
  background:var(--ink);color:var(--land);padding:9px 14px;border-radius:10px;font-size:14px;font-weight:500;
  opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:var(--shadow);max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.banner{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 66px);max-width:460px;
  background:var(--panel);border:1px solid var(--panel-edge);border-radius:12px;padding:9px 12px;font-size:13.5px;
  color:var(--muted);box-shadow:var(--shadow);display:none}
.banner.on{display:block}
@media (prefers-reduced-motion:reduce){.sheet,.toast{transition:none}}
@media (max-width:560px){.placing-on .brand{display:none}.hint{margin-left:0;flex:1}}
@media (max-width:420px){.brand h1{font-size:17px}.primary{min-width:0;width:100%}}
</style>
</head>
<body>
<div id="app">
  <div id="map"><canvas id="cv" aria-label="Карта: Москва, Московская область и мир" role="img"></canvas><div id="pins"></div></div>

  <div class="top">
    <div class="brand"><h1>Кто где</h1><span class="count" id="count">загрузка…</span></div>
    <div class="hint" id="hint"><span id="hintText">Нажмите на карту там, где вы примерно находитесь</span><button id="cancelPlace" type="button">Отмена</button></div>
  </div>
  <div class="banner" id="banner"></div>

  <div class="rail">
    <button type="button" id="zin" aria-label="Приблизить">+</button>
    <button type="button" id="zout" aria-label="Отдалить">−</button>
    <div class="gap"></div>
    <button type="button" id="fitMo" aria-label="Показать Москву и область" title="Москва и область">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></button>
    <button type="button" id="fitWorld" aria-label="Показать весь мир" title="Весь мир">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></button>
    <button type="button" id="fitMe" aria-label="Показать мою точку" title="Моя точка" hidden>
      <svg viewBox="0 0 24 24"><path d="M12 21s-6-5.6-6-11a6 6 0 1 1 12 0c0 5.4-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg></button>
  </div>

  <div class="bottom"><button type="button" class="primary" id="placeBtn" disabled>Поставить свою точку</button></div>
  <div class="attr">© OpenStreetMap, Natural Earth</div>

  <section class="sheet" id="sheet" aria-live="polite"></section>
  <div class="toast" id="toast" role="status"></div>
</div>

  dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(Wd*dpr); cv.height=Math.round(Ht*dpr);
  zoom.scaleExtent([Math.min(Wd,Ht)/W0*0.8,5000]);
  schedule();
}
new ResizeObserver(resize).observe(mapEl);

function fitBox(b,pad,dur){
  const bottomPad=sheet.classList.contains("open")?Math.min(Ht*0.45,340):90;
  const w=Wd-2*pad-56, h=Ht-pad-bottomPad-70;
  const k=Math.min(w/(b[1][0]-b[0][0]),h/(b[1][1]-b[0][1]));
  const cx=(b[0][0]+b[1][0])/2, cy=(b[0][1]+b[1][1])/2;
  const tx=(Wd-56)/2-cx*k+pad*0, ty=70+(Ht-70-bottomPad)/2-cy*k;
  const t=d3.zoomIdentity.translate(tx,ty).scale(k);
  (dur&&!reduceMotion?zsel.transition().duration(dur):zsel).call(zoom.transform,t);
}
function flyTo(lng,lat,k,dur){
  const [x,y]=proj([lng,lat]);
  const bottomPad=Math.min(Ht*0.45,340);
  const t=d3.zoomIdentity.translate(Wd/2-x*k,(Ht-bottomPad)/2+20-y*k).scale(k);
  (dur&&!reduceMotion?zsel.transition().duration(dur):zsel).call(zoom.transform,t);
}

/* ---------- drawing ---------- */
let raf=0;
function schedule(){ if(!raf) raf=requestAnimationFrame(draw); }
function vis(b,v){ return !(b[1][0]<v[0]||b[0][0]>v[2]||b[1][1]<v[1]||b[0][1]>v[3]); }
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

function draw(){
  raf=0; if(!Wd) return;
  const k=T.k;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=C.water; ctx.fillRect(0,0,Wd,Ht);
  const v=[(-T.x)/k,(-T.y)/k,(Wd-T.x)/k,(Ht-T.y)/k];
  ctx.setTransform(dpr*k,0,0,dpr*k,dpr*T.x,dpr*T.y);
  ctx.lineJoin="round"; ctx.lineCap="round";

  // countries
  ctx.fillStyle=C.land;
  for(const it of L.c) if(vis(it.b,v)) ctx.fill(it.path);
  // disputed
  const hp=hatchPattern(); if(hp.setTransform) hp.setTransform(new DOMMatrix().scale(1/k));
  ctx.fillStyle=hp;
  for(const it of L.d) if(vis(it.b,v)) ctx.fill(it.path);
  ctx.strokeStyle=C.border; ctx.lineWidth=0.7/k;
  for(const it of L.c) if(vis(it.b,v)) ctx.stroke(it.path);
  ctx.setLineDash([3/k,2.5/k]);
  for(const it of L.d) if(vis(it.b,v)) ctx.stroke(it.path);
  ctx.setLineDash([]);

  // Moscow region
  const a=clamp((k-6)/10,0,1);
  if(a>0&&vis(moB,v)){
    ctx.globalAlpha=a;
    ctx.fillStyle=C.local; for(const it of L.mo) ctx.fill(it.path);
    ctx.fillStyle=C.moscow; ctx.fill(mskItem.path);
    if(k>18){
      ctx.strokeStyle=C.line; ctx.lineWidth=0.8/k;
      for(const it of L.go) if(vis(it.b,v)) ctx.stroke(it.path);
    }
    if(k>160){
      ctx.globalAlpha=a*clamp((k-160)/140,0,1);
      ctx.strokeStyle=C.line; ctx.lineWidth=0.7/k;
      for(const it of L.rn) if(vis(it.b,v)) ctx.stroke(it.path);
      ctx.globalAlpha=a;
    }
    if(k>40){
      ctx.strokeStyle=C.border; ctx.lineWidth=1/k;
      for(const it of L.okr) if(vis(it.b,v)) ctx.stroke(it.path);
    }
    // rivers
    ctx.strokeStyle=C.river;
    for(const it of L.riv){ if(!vis(it.b,v)) continue;
      const main=it.p.n==="Москва"||it.p.n==="Ока"||it.p.n==="Волга";
      if(!main&&k<40) continue;
      ctx.lineWidth=(main?clamp(k/60,1.1,3.2):clamp(k/120,0.8,2))/k; ctx.stroke(it.path); }
    // ring roads
    ctx.strokeStyle=C.road;
    for(const it of L.roads){ if(!vis(it.b,v)) continue;
      const n=it.p.n; let w;
      if(n==="МКАД") w=clamp(k/40,1.2,3.4);
      else if(n==="ЦКАД") w=clamp(k/70,1,2.4);
      else if(n==="ТТК"){ if(k<120) continue; w=clamp(k/160,1,2.2);}
      else { if(k<240) continue; w=clamp(k/300,0.9,1.8);}
      ctx.lineWidth=w/k; ctx.stroke(it.path); }
    ctx.strokeStyle=C.border; ctx.lineWidth=1.4/k;
    for(const it of L.mo) ctx.stroke(it.path);
    ctx.lineWidth=1.2/k; ctx.stroke(mskItem.path);
    ctx.globalAlpha=1;
  }

  // pin areas
  for(const p of pins){ drawArea(p,false,k); }
  if(draft) drawArea(draft,true,k);

  // labels in screen space
  ctx.setTransform(dpr,0,0,dpr,0,0);
  placePins();
  drawLabels(k,v);
}

function areaRadius(p){
  const [x,y]=proj([p.lng,p.lat]); const [,y2]=proj([p.lng,Math.min(84.9,p.lat+p.r/111.32)]);
  return [x,y,Math.abs(y-y2)];
}
function drawArea(p,isDraft,k){
  const [x,y,r]=areaRadius(p); if(r*k<3&&!isDraft) return;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.globalAlpha=isDraft?0.18:0.1; ctx.fillStyle=C.accent; ctx.fill();
  ctx.globalAlpha=isDraft?0.9:0.45; ctx.strokeStyle=C.accent; ctx.lineWidth=(isDraft?1.6:1)/k;
  if(isDraft) ctx.setLineDash([5/k,4/k]);
  ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha=1;
  if(isDraft){ ctx.beginPath(); ctx.arc(x,y,4.5/k,0,Math.PI*2); ctx.fillStyle=C.accent; ctx.fill(); }
}

const FONT="Onest, system-ui, sans-serif";
let occupied=[];
function fits(r){ for(const o of occupied){ if(r[0]<o[2]&&r[2]>o[0]&&r[1]<o[3]&&r[3]>o[1]) return false; } return true; }
function label(txt,sx,sy,size,weight,color,opts={}){
  ctx.font=`${weight} ${size}px ${FONT}`;
  const w=ctx.measureText(txt).width, h=size;
  let x=sx,y=sy,align="center";
  if(opts.right){ x=sx+6; align="left"; }
  const r=align==="center"?[x-w/2-3,y-h/2-2,x+w/2+3,y+h/2+2]:[x-2,y-h/2-2,x+w+3,y+h/2+2];
  if(r[0]<2||r[2]>Wd-2||r[1]<2||r[3]>Ht-2) return false;
  if(!fits(r)) return false;
  occupied.push(r);
  if(opts.dot){ ctx.beginPath(); ctx.arc(sx,sy,2.6,0,Math.PI*2); ctx.fillStyle=C.ink; ctx.fill(); }
  ctx.textAlign=align; ctx.textBaseline="middle";
  ctx.lineWidth=3.2; ctx.strokeStyle=C.halo; ctx.lineJoin="round"; ctx.strokeText(txt,x,y);
  ctx.fillStyle=color; ctx.fillText(txt,x,y);
  return true;
}
const S=(xy)=>[xy[0]*T.k+T.x,xy[1]*T.k+T.y];
function textW(t,size,weight){ ctx.font=`${weight} ${size}px ${FONT}`; return ctx.measureText(t).width; }

function drawLabels(k,v){
  occupied=pinRects.slice();
  // Moscow
  if(k>9&&k<110){ const s=S(mskItem.lp); label("Москва",s[0],s[1],k<30?12.5:14,700,C.ink); }
  // okrugs
  if(k>=110&&k<520){
    for(const it of L.okr){ if(!vis(it.b,v)) continue;
      const w=(it.b[1][0]-it.b[0][0])*k; if(w<textW(it.p.s,12,600)+10) continue;
      const s=S(it.lp); label(it.p.s,s[0],s[1],12,600,C.muted); }
  }
  // towns
  if(k>16){
    const th=k<30?150000:k<60?70000:k<120?30000:k<240?12000:0;
    for(const t of towns){ if(t.p<th) break;
      const s=S(t.xy); label(t.n,s[0],s[1],k<60?11.5:12.5,500,C.ink,{right:true,dot:true}); }
  }
  // districts
  if(k>=380){
    for(const it of L.rn){ if(!vis(it.b,v)) continue;
      const w=(it.b[1][0]-it.b[0][0])*k; if(w<textW(it.p.s,11,500)+8) continue;
      const s=S(it.lp); label(it.p.s,s[0],s[1],11,500,C.muted); }
  }
  // oblast name
  if(k>9&&k<26){ const s=S(proj([37.2,56.55])); label("Московская область",s[0],s[1],11.5,500,C.muted); }
  // countries
  if(k<60){
    for(const it of L.c){ if(!it.lp||!vis(it.b,v)) continue;
      if(it.p.n==="Россия"&&k>14) continue;
      const w=(it.b[1][0]-it.b[0][0])*k, size=w>220?13:11.5;
      if(w<textW(it.p.n,size,500)+10) continue;
      const s=S(it.lp); label(it.p.n,s[0],s[1],size,500,C.muted); }
  }
}

/* ---------- geography lookup ---------- */
function inB(gb,lng,lat){ return lat>=gb[0][1]-0.01&&lat<=gb[1][1]+0.01&&(gb[0][0]<=gb[1][0]?(lng>=gb[0][0]-0.01&&lng<=gb[1][0]+0.01):(lng>=gb[0][0]||lng<=gb[1][0])); }
function find(layer,lng,lat){ for(const it of layer){ if(inB(it.gb,lng,lat)&&d3.geoContains(it.f,[lng,lat])) return it; } return null; }
function describe(lng,lat){
  const rn=find(L.rn,lng,lat);
  if(rn){ const o=find(L.okr,lng,lat); return rn.p.n+(o?", "+o.p.s:"")+", Москва"; }
  if(d3.geoContains(mskItem.f,[lng,lat])) return "Москва";
  const g=find(L.go,lng,lat); if(g) return g.p.n+", Московская область";
  const d=find(L.d,lng,lat); if(d) return d.p.n+" (спорная территория)";
  const c=find(L.c,lng,lat); if(c) return c.p.n;
  return "Вне суши";
}
const descCache=new Map();
function descOf(p){ const key=p.lng+","+p.lat; if(!descCache.has(key)) descCache.set(key,describe(p.lng,p.lat)); return descCache.get(key); }

function clean(id,d){
  if(!d) return null;
  const lat=+d.lat,lng=+d.lng;
  if(!isFinite(lat)||!isFinite(lng)||Math.abs(lat)>84||Math.abs(lng)>180) return null;
  const nick=String(d.nick||"").replace(/\s+/g," ").trim().slice(0,24); if(!nick) return null;
  let tg=String(d.tg||"").trim().replace(/^@/,""); if(!/^[A-Za-z0-9_]{4,32}$/.test(tg)) tg="";
  const bio=String(d.bio||"").trim().slice(0,140);
  const r=RADII.includes(+d.r)?+d.r:1;
  const avatar=typeof d.avatar==="string"&&/^https:\/\//.test(d.avatar)?d.avatar.slice(0,500):"";
  return {id,lat,lng,nick,tg,bio,r,ts:+d.ts||0,avatar};
}
function mine(p){ return uid&&p.id===uid; }

function syncPinNodes(){
  const seen=new Set();
  for(const p of pins){
    seen.add(p.id);
    let n=pinNodes.get(p.id);
    if(!n){
      n=document.createElement("button"); n.type="button"; n.className="pin";
      n.innerHTML='<span class="tag"></span><span class="dot"></span>';
      n.addEventListener("click",e=>{ e.stopPropagation(); if(placing) return; pinClick(n._id); });
      pinsEl.appendChild(n); pinNodes.set(p.id,n);
    }
    n._id=p.id;
    n.querySelector(".tag").textContent=p.nick;
    n.setAttribute("aria-label",p.nick+(p.tg?", @"+p.tg:""));
    n.classList.toggle("mine",!!mine(p)); n.classList.toggle("sel",p.id===selId);
  }
  for(const [id,n] of pinNodes) if(!seen.has(id)){ n.remove(); pinNodes.delete(id); }
  const cnt=pins.length;
  $("count").textContent=cnt?cnt+" "+plural(cnt,["человек","человека","человек"])+" на карте":"пока никого";
  $("fitMe").hidden=!pins.some(mine);
  updatePlaceBtn();
  schedule();
}
function pinClick(id){
  const p=pins.find(x=>x.id===id); if(!p) return;
  const s=S(proj([p.lng,p.lat]));
  const near=pins.filter(q=>{ const t=S(proj([q.lng,q.lat])); return Math.hypot(t[0]-s[0],t[1]-s[1])<18; });
  if(near.length>1&&T.k<4500){
    let bx=0,by=0; near.forEach(q=>{ const b=proj([q.lng,q.lat]); bx+=b[0]; by+=b[1]; }); bx/=near.length; by/=near.length;
    const k=Math.min(5000,T.k*4);
    const t=d3.zoomIdentity.translate(Wd/2-bx*k,Ht/2-by*k).scale(k);
    (reduceMotion?zsel:zsel.transition().duration(550)).call(zoom.transform,t);
    return;
  }
  openPin(id);
}
function plural(n,f){ const a=n%10,b=n%100; return f[(a===1&&b!==11)?0:(a>=2&&a<=4&&(b<10||b>=20))?1:2]; }

function placePins(){
  pinRects=[];
  const order=pins.slice().sort((a,b)=>(b.id===selId)-(a.id===selId)||(mine(b)?1:0)-(mine(a)?1:0)||b.ts-a.ts);
  ctx.font=`500 12.5px ${FONT}`;
  const items=[];
  for(const p of order){
    const n=pinNodes.get(p.id); if(!n) continue;
    const s=S(proj([p.lng,p.lat]));
    const off=s[0]<-60||s[0]>Wd+60||s[1]<-40||s[1]>Ht+40;
    n.style.display=off?"none":"";
    if(off) continue;
    n.style.transform=`translate(${s[0]}px,${s[1]}px)`;
    items.push({p,n,s,dot:[s[0]-8,s[1]-8,s[0]+8,s[1]+8]});
  }
  const hit=(r,o)=>r[0]<o[2]&&r[2]>o[0]&&r[1]<o[3]&&r[3]>o[1];
  const tags=[];
  for(const it of items){
    const w=Math.min(170,ctx.measureText(it.p.nick).width+16), s=it.s;
    const r=[s[0]-w/2,s[1]-39,s[0]+w/2,s[1]-14];
    let ok=!tags.some(o=>hit(r,o));
    if(ok) for(const o of items){ if(o!==it&&hit(r,o.dot)){ok=false;break;} }
    it.n.classList.toggle("notag",!ok);
    if(ok) tags.push(r);
  }
  pinRects=items.map(i=>i.dot).concat(tags);
}
function ensureVisible(lng,lat){
  const s=S(proj([lng,lat]));
  const hSheet=sheet.offsetHeight||0;
  const wide=Wd>=760;
  const top=wide?Ht-16-hSheet:Ht-hSheet;
  const covered=wide?(s[0]<440&&s[1]>top-24):(s[1]>top-24);
  const tooHigh=s[1]<90;
  let dy=0;
  if(covered) dy=(top-60)-s[1];
  else if(tooHigh) dy=120-s[1];
  if(Math.abs(dy)>1) (reduceMotion?zsel:zsel.transition().duration(300)).call(zoom.translateBy,0,dy/T.k);
}

  const rt=el("span"); rt.textContent="Насколько точно показывать"; rt.style.fontSize="13.5px"; rt.style.color="var(--muted)"; rl.appendChild(rt);
  const rr=el("div","radii"); rr.setAttribute("role","group");
  RADII.forEach(v=>{ const bb=btn(fmtR(v),"",()=>{ form.r=v; if(draft) draft.r=v; [...rr.children].forEach(c=>c.setAttribute("aria-pressed",c===bb)); schedule(); });
    bb.setAttribute("aria-pressed",form.r===v); rr.appendChild(bb); });
  rl.appendChild(rr); f.appendChild(rl);
  const note=el("p","note"); note.textContent=localOnly?"Сервер недоступен: точка видна только вам до перезагрузки.":"Точку, ник, аватарку и ссылку на Телеграм увидят все, у кого есть ссылка на карту.";
  f.appendChild(note);
  const err=el("p","err"); err.id="formErr"; f.appendChild(err);
  const act=el("div","actions"); act.style.marginTop="0";
  const save=el("button","btn main"); save.type="submit"; save.textContent="Сохранить точку"; act.appendChild(save);
  act.appendChild(btn("Отмена","btn",stopPlacing));
  f.appendChild(act);
  f.addEventListener("submit",e=>{ e.preventDefault(); savePin(save); });
  sheet.appendChild(f);
  openSheet();
  setTimeout(()=>{ const n=f.querySelector("input"); if(n&&!form.nick&&matchMedia("(pointer:fine)").matches) n.focus(); },250);
}
function field(lbl,key,type,val,max,ph,prefix){
  const l=el("label","f"); const s=el("span"); s.textContent=lbl; l.appendChild(s);
  const box=el("div","inp");
  if(prefix){ const p=el("span"); p.textContent=prefix; box.appendChild(p); }
  const i=type==="textarea"?el("textarea"):el("input");
  if(type==="textarea") i.rows=2; else i.type="text";
  i.maxLength=max; i.placeholder=ph; i.value=val||""; i.name=key;
  if(key==="tg"){ i.autocapitalize="off"; i.autocomplete="off"; i.spellcheck=false; }
  i.addEventListener("input",()=>{ form[key]=i.value; });
  box.appendChild(i); l.appendChild(box); return l;
}

async function savePin(saveBtn){
  const err=$("formErr");
  if(!draft){ err.textContent="Сначала нажмите на карту, чтобы отметить место."; return; }
  const nick=form.nick.replace(/\s+/g," ").trim();
  if(!nick){ err.textContent="Укажите ник — он будет подписью над точкой."; return; }
  const doc={nick:nick.slice(0,24),bio:form.bio.trim().slice(0,140),lat:draft.lat,lng:draft.lng,r:form.r,ts:Date.now()};
  err.textContent="";
  if(localOnly){
    const id=uid||"local"; uid=id;
    pins=pins.filter(p=>p.id!==id); pins.push(clean(id,doc)); finishSave(id); return;
  }
  if(!uid){ stopPlacing(); openLogin(); return; }
  saveBtn.disabled=true; saveBtn.textContent="Сохраняем…";
  const fail=msg=>{ saveBtn.disabled=false; saveBtn.textContent="Сохранить точку"; err.textContent=msg; };
  try{
    const {data,error}=await sb.from("pins").upsert({user_id:uid,nick:doc.nick,bio:doc.bio,lat:doc.lat,lng:doc.lng,r:doc.r},{onConflict:"user_id"}).select().single();
    if(error) return fail(error.code==="23505"?"Этот Телеграм уже стоит на карте с другого аккаунта."
      :error.code==="42501"?"Ставить точки можно только после входа через Telegram. Выйдите и войдите заново."
      :error.code==="23514"?"Проверьте поля: что-то не проходит по формату."
      :"Не получилось сохранить. Проверьте соединение и попробуйте ещё раз.");
    upsertLocal(data);
    finishSave(uid);
  }catch(ex){ fail("Не получилось сохранить. Проверьте соединение и попробуйте ещё раз."); }
}
const TG_ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.9 4.3 18.7 19.4c-.2 1-.9 1.3-1.7.8l-4.8-3.5-2.3 2.2c-.3.3-.5.5-1 .5l.3-4.9 8.9-8c.4-.3-.1-.5-.6-.2L6.5 13.2l-4.7-1.5c-1-.3-1-1 .2-1.5L20.5 3c.9-.3 1.6.2 1.4 1.3z"/></svg>';
function openLogin(){
  selId=null; syncPinNodes();
  sheet.innerHTML="";
  const head=el("div","sheet-head");
  const h=el("h2"); h.textContent="Вход через Telegram"; head.appendChild(h);
  const x=el("button","x"); x.type="button"; x.setAttribute("aria-label","Закрыть"); x.innerHTML=X_ICON; x.onclick=closeSheet; head.appendChild(x);
  sheet.appendChild(head);
  const p=el("p","lead"); p.textContent="Чтобы поставить точку, подтвердите аккаунт в Telegram. Над точкой будет ваш ник, а в карточке — ссылка на профиль: выдать себя за другого не получится.";
  sheet.appendChild(p);
  const err=el("p","err"); err.style.marginTop="10px";
  const b=el("button","tgbtn"); b.type="button"; b.innerHTML=TG_ICON; b.append("Войти через Telegram"); b.style.marginTop="16px";
  b.onclick=async()=>{
    b.disabled=true; err.textContent="";
    try{ sessionStorage.setItem("kg_after","place"); }catch(e){}
    const {error}=await sb.auth.signInWithOAuth({provider:"custom:telegram",options:{redirectTo:location.origin+location.pathname,scopes:"openid profile"}});
    if(error){ b.disabled=false; err.textContent=/provider|not found|not enabled/i.test(error.message||"")?"Вход через Telegram ещё не настроен на сервере.":"Не получилось начать вход: "+error.message; }
  };
  sheet.appendChild(b); sheet.appendChild(err);
  openSheet();
}
async function signOut(){
  try{ await sb.auth.signOut(); }catch(e){}
  uid=null; me=null; isOwner=false; closeSheet(); syncPinNodes(); toast("Вы вышли");
}
function readMe(user){
  if(!user){ me=null; return; }
  const um=user.user_metadata||{}, cc=um.custom_claims||{};
  let username=um.preferred_username||um.user_name||cc.preferred_username||"";
  if(!/^[A-Za-z0-9_]{4,32}$/.test(username)) username="";
  const name=(um.name||um.full_name||[um.given_name,um.family_name].filter(Boolean).join(" ")||username||"").replace(/\s+/g," ").trim().slice(0,24);
  me={username,name};
}
function rowToPin(row){ return row?clean(row.user_id,{...row,ts:Date.parse(row.updated_at)||Date.now()}):null; }
function upsertLocal(row){ const p=rowToPin(row); if(!p) return; pins=pins.filter(x=>x.id!==p.id); pins.push(p); }
function finishSave(id){
  const d=draft; stopPlacing(); toast("Точка сохранена");
  syncPinNodes(); openPin(id);
}
async function removePin(p,b){
  if(!confirm(mine(p)?"Убрать вашу точку с карты?":"Удалить точку «"+p.nick+"»?")) return;
  if(localOnly){ pins=pins.filter(x=>x.id!==p.id); closeSheet(); syncPinNodes(); toast("Точка убрана"); return; }
  b.disabled=true;
  try{
    const {data,error}=await sb.from("pins").delete().eq("user_id",p.id).select("user_id");
    if(error||!data||!data.length){ b.disabled=false; toast(error?"Не получилось убрать точку. Попробуйте ещё раз.":"Нет прав убрать эту точку."); return; }
    pins=pins.filter(x=>x.id!==p.id); closeSheet(); syncPinNodes(); toast("Точка убрана");
  }catch(ex){ b.disabled=false; toast("Не получилось убрать точку. Попробуйте ещё раз."); }
}

let toastT=0;
function toast(t){ const n=$("toast"); n.textContent=t; n.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>n.classList.remove("on"),2200); }
function banner(t){ const b=$("banner"); b.textContent=t; b.classList.toggle("on",!!t); }

/* ---------- controls ---------- */
$("zin").onclick=()=>zsel.transition().duration(reduceMotion?0:250).call(zoom.scaleBy,2);
$("zout").onclick=()=>zsel.transition().duration(reduceMotion?0:250).call(zoom.scaleBy,0.5);
$("fitMo").onclick=()=>fitBox(moB,16,600);
$("fitWorld").onclick=()=>fitBox([[0,120],[W0,800]],8,700);
$("fitMe").onclick=()=>{ const p=pins.find(mine); if(p){ flyTo(p.lng,p.lat,Math.max(T.k,400),700); openPin(p.id);} };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(placing) stopPlacing(); else closeSheet(); } });

/* ---------- boot ---------- */
readTheme();
resize();
requestAnimationFrame(()=>{ resize(); fitBox(moB,16,0); });
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(schedule);

(async function connect(){
  if(!window.supabase||!window.supabase.createClient){ goLocal(); return; }
  try{ sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}}); }
  catch(e){ goLocal(); return; }
  updatePlaceBtn();
  const qs=new URLSearchParams(location.search+"&"+location.hash.replace(/^#/,""));
  const authErr=qs.get("error_description")||qs.get("error");
  const applySession=async session=>{
    const u=session&&session.user?session.user:null;
    uid=u?u.id:null; readMe(u); isOwner=false;
    if(uid){ try{ const r=await sb.rpc("is_admin"); isOwner=!r.error&&r.data===true; }catch(e){} }
    syncPinNodes();
  };
  try{
    const {data:{session}}=await sb.auth.getSession();
    await applySession(session);
  }catch(e){ uid=null; }
  if(/[?&#](code|access_token|error|error_description|state)=/.test(location.href))
    history.replaceState(null,"",location.origin+location.pathname);
  sb.auth.onAuthStateChange((ev,session)=>{ if(ev==="SIGNED_IN"||ev==="SIGNED_OUT"||ev==="USER_UPDATED") setTimeout(()=>applySession(session),0); });
  let after=null; try{ after=sessionStorage.getItem("kg_after"); sessionStorage.removeItem("kg_after"); }catch(e){}
  if(authErr) toast("Вход не удался: "+authErr.replace(/\+/g," ").slice(0,120));
  else if(after==="place"&&uid) setTimeout(()=>startPlacing(null),400);
  const load=async()=>{
    const {data,error}=await sb.from("pins").select("user_id,nick,tg,bio,lat,lng,r,updated_at,avatar").limit(2000);
    if(error){ banner("Не удалось загрузить точки. Проверьте соединение и обновите страницу."); return; }
    banner("");
    pins=data.map(rowToPin).filter(Boolean); syncPinNodes();
  };
  await load();
  sb.channel("pins-live").on("postgres_changes",{event:"*",schema:"public",table:"pins"},pl=>{
    if(pl.eventType==="DELETE"){ const id=pl.old&&pl.old.user_id; pins=pins.filter(p=>p.id!==id); if(selId===id) closeSheet(); }
    else upsertLocal(pl.new);
    syncPinNodes();
  }).subscribe(st=>{ if(st==="CHANNEL_ERROR"||st==="TIMED_OUT") setTimeout(load,5000); });
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) load(); });
})();
function goLocal(){
  localOnly=true; uid="local";
  banner("Сервер недоступен — точки не сохранятся и видны только вам.");
  $("count").textContent="пока никого"; updatePlaceBtn();
}
})();
</script>
